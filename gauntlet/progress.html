<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gauntlet — Slow Roads++</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#080a0e; --panel:#121721; --panel2:#0e131b; --panel3:#182030; --line:#242e3d;
    --fg:#f2f6fc; --dim:#9fb0c6; --dimmer:#66788f;
    --ours:#4ade80; --bar:#fb7185; --tie:#fbbf24; --busy:#60a5fa; --idle:#4b5a6d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:16px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1900px;margin:0 auto;padding:16px 22px 70px}

  /* ------------------------------------------------------------- header */
  header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:14px 20px;background:linear-gradient(180deg,#161d29,#0d1218);
    border:1px solid var(--line);border-radius:12px;position:sticky;top:10px;z-index:20;
    box-shadow:0 12px 34px rgba(0,0,0,.6)}
  header h1{margin:0;font-size:26px;letter-spacing:-.6px;font-weight:700;white-space:nowrap}
  header h1 span{color:var(--dimmer);font-weight:400}
  .kpis{display:flex;gap:30px;margin-left:auto;flex-wrap:wrap;align-items:flex-end}
  .kpi{text-align:right}
  .kpi b{display:block;font-size:34px;line-height:1.05;font-weight:750;letter-spacing:-1px;
    font-variant-numeric:tabular-nums}
  .kpi i{font-style:normal;font-size:10px;letter-spacing:1.9px;color:var(--dimmer);text-transform:uppercase}
  .kpi.ours b{color:var(--ours)}
  .track{height:9px;border-radius:9px;background:#161e29;overflow:hidden;width:100%;
    display:flex;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
  .track > i{display:block;height:100%}
  .track > i.w{background:linear-gradient(90deg,#16a34a,#4ade80)}
  .track > i.j{background:linear-gradient(90deg,#2563eb,#60a5fa)}
  .track > i.b{background:linear-gradient(90deg,#b45309,#fbbf24)}

  h2{font-size:11px;letter-spacing:2.6px;color:var(--dimmer);
    text-transform:uppercase;margin:26px 0 10px;font-weight:700;display:flex;gap:12px;align-items:center}
  h2 em{font-style:normal;color:#5b6d84;letter-spacing:.5px;font-size:11.5px;text-transform:none}

  /* --------------------------------------------------------------- hero */
  .hero{display:grid;grid-template-columns:auto 1fr;gap:0;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .hero .ab{width:calc((100vh - 420px) * 16 / 9);min-width:420px;max-width:62vw;aspect-ratio:16/9}
  .hero .side{padding:14px 18px;border-left:1px solid var(--line);background:var(--panel2);
    display:flex;flex-direction:column;gap:10px;overflow:hidden}
  .hero .side .who{font-size:26px;font-weight:750;letter-spacing:-.5px}
  .hero .side dl{margin:0;display:grid;grid-template-columns:82px 1fr;gap:5px 10px;font-size:14px}
  .hero .side dt{color:var(--dimmer);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding-top:3px}
  .hero .side dd{margin:0;color:#dbe5f0;word-break:break-word}
  .hero .side dd.path{font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#93a8c0;
    overflow-wrap:anywhere}

  /* --------------------------------------------------------------- A/B */
  .ab{position:relative;background:#04060a;aspect-ratio:16/9;cursor:pointer;
    overflow:hidden;user-select:none}
  .ab img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    transition:opacity .09s linear}
  .ab img.b{opacity:0}
  .ab.swapped img.a{opacity:0}
  .ab.swapped img.b{opacity:1}
  .ab .tag{position:absolute;left:10px;top:10px;font-size:11px;letter-spacing:2px;
    padding:4px 10px;border-radius:5px;font-weight:800;color:#04060a;background:var(--ours)}
  .ab.swapped .tag{background:var(--bar)}
  .ab .hint{position:absolute;right:10px;bottom:9px;font-size:10px;letter-spacing:1.3px;
    color:#dbe5f0;background:rgba(0,0,0,.62);padding:3px 9px;border-radius:5px;opacity:.8}
  .ab .miss{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;
    align-items:center;justify-content:center;color:#3d4b5d;font-size:11px;letter-spacing:2.4px;
    text-align:center;padding:12px;background:
      repeating-linear-gradient(45deg,#0a0e14 0 12px,#0d1219 12px 24px)}
  .ab .miss code{letter-spacing:0;font-size:11px;color:#4d5f74;word-break:break-all}
  .ab.small{aspect-ratio:16/9}

  /* -------------------------------------------------------------- cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    overflow:hidden;display:flex;flex-direction:column;border-left-width:5px}
  .card.won{border-left-color:var(--ours)}
  .card.judging{border-left-color:var(--busy)}
  .card.building{border-left-color:var(--tie)}
  .card.blocked{border-left-color:var(--bar)}
  .card.pending{border-left-color:var(--idle)}
  .chead{display:flex;align-items:center;gap:9px;padding:11px 13px 8px}
  .chead .id{font-size:19px;font-weight:750;letter-spacing:-.3px}
  .chead .rd{font-size:12px;letter-spacing:1.4px;color:var(--dimmer);margin-left:auto;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
    padding:3px 8px;border-radius:20px;font-weight:800;background:#1e2733;color:var(--dim);white-space:nowrap}
  .pill.ours{background:rgba(74,222,128,.18);color:var(--ours)}
  .pill.bar{background:rgba(251,113,133,.18);color:var(--bar)}
  .pill.tie{background:rgba(251,191,36,.18);color:var(--tie)}
  .pill.building{background:rgba(96,165,250,.16);color:var(--busy)}
  .ctitle{padding:0 13px 9px;color:var(--dim);font-size:12.5px;line-height:1.4}
  .gap{padding:9px 13px 12px;font-size:13px;color:#dbe5f0;border-top:1px solid var(--line);
    background:var(--panel2);min-height:46px}
  .gap b{color:var(--dimmer);font-weight:700;letter-spacing:1.4px;font-size:9.5px;
    text-transform:uppercase;display:block;margin-bottom:3px}
  .gap .none{color:#3d4b5d}

  /* --------------------------------------------------------------- feed */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--dimmer);font-size:9.5px;letter-spacing:1.9px;
    text-transform:uppercase;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:700;
    position:sticky;top:96px;background:var(--bg);z-index:5}
  td{padding:7px 10px;border-bottom:1px solid #141b25;vertical-align:top}
  tbody tr:hover td{background:#131a24}
  td.t{color:var(--dimmer);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12.5px}
  td.p{font-weight:750;white-space:nowrap}
  td.s{color:#d3dde9}
  td.s .g{color:#8497ac;font-size:12.5px}
  .thumb{height:40px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;
    background:#04060a;display:inline-block}
  footer{color:var(--dimmer);font-size:12px;margin-top:26px;letter-spacing:.3px}
  footer.stale{color:var(--bar);font-weight:700}
  @media (max-width:1100px){ .hero{grid-template-columns:1fr} .hero .side{border-left:0;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gauntlet <span>/ Slow Roads++</span></h1>
    <div class="kpis">
      <div class="kpi ours"><b id="k-won">0/10</b><i>pieces won</i></div>
      <div class="kpi"><b id="k-rounds">0</b><i>rounds</i></div>
      <div class="kpi"><b id="k-active">0</b><i>in flight</i></div>
      <div class="kpi"><b id="k-elapsed">–</b><i>elapsed</i></div>
      <div class="kpi"><b id="k-last">–</b><i>last activity</i></div>
    </div>
    <div class="track"><i class="w" id="t-won"></i><i class="j" id="t-judge"></i><i class="b" id="t-build"></i></div>
  </header>

  <h2>Latest A/B <em id="hero-note"></em></h2>
  <div class="hero" id="hero"></div>

  <h2>Pieces <em>click any frame to swap ours &harr; bar</em></h2>
  <div class="grid" id="cards"></div>

  <h2>Activity</h2>
  <table>
    <thead><tr><th>when</th><th>piece</th><th>rd</th><th>agent</th><th>winner</th><th>summary / gap</th><th>shots</th></tr></thead>
    <tbody id="feed"></tbody>
  </table>

  <footer id="foot">connecting…</footer>
</div>

<script>
'use strict';
const el = (id) => document.getElementById(id);
const swapped = new Set();          // pieces the viewer has flipped to the bar shot
let lastStamp = '';

function node(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function dur(ms) {
  if (!isFinite(ms) || ms < 0) return '–';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? h + 'h' + String(m).padStart(2, '0') : m + 'm' + String(s % 60).padStart(2, '0') + 's';
}
function ago(ts) {
  const d = Date.now() - new Date(ts).getTime();
  if (!isFinite(d)) return '–';
  if (d < 60000) return Math.max(0, Math.floor(d / 1000)) + 's ago';
  if (d < 3600000) return Math.floor(d / 60000) + 'm ago';
  if (d < 86400000) return Math.floor(d / 3600000) + 'h ago';
  return Math.floor(d / 86400000) + 'd ago';
}
/** project-relative path -> server URL. Paths in state.json look like "shots/x/y.png". */
function url(p, bust) {
  if (!p) return '';
  let s = String(p).trim().replace(/^\.\//, '').replace(/^\/+/, '');
  return '/' + s + (bust ? '?v=' + encodeURIComponent(bust) : '');
}
function statusOf(p) {
  if (p.verdict === 'ours' || p.verdict === 'tie' || p.status === 'won') return 'won';
  if (p.status === 'blocked') return 'blocked';
  if (p.status === 'building') return 'building';
  if (p.status === 'judging') return 'judging';
  return 'pending';
}
function pill(p) {
  const s = statusOf(p);
  if (s === 'building') return node('span', 'pill building', 'building');
  if (p.verdict === 'ours') return node('span', 'pill ours', 'ours wins');
  if (p.verdict === 'tie') return node('span', 'pill tie', 'tie');
  if (p.verdict === 'bar') return node('span', 'pill bar', 'bar wins');
  return node('span', 'pill', s);
}

/**
 * A clickable A/B stack. Missing images degrade to a hatched placeholder that
 * prints the path it wanted, so a wrong path in state.json is obvious at a glance.
 */
function abBlock(key, ourPath, barPath, bust, small) {
  const box = node('div', 'ab' + (small ? ' small' : '') + (swapped.has(key) ? ' swapped' : ''));
  const have = [];
  const add = (cls, p, label) => {
    if (!p) return;
    const img = node('img', cls);
    img.alt = label;
    img.src = url(p, cls === 'a' ? bust : '');
    img.addEventListener('error', () => { img.remove(); missing(label, p); });
    box.appendChild(img);
    have.push(label);
  };
  const missing = (label, p) => {
    const m = node('div', 'miss');
    m.appendChild(node('div', null, label + ' SHOT MISSING'));
    m.appendChild(node('code', null, p || '(no path recorded)'));
    box.appendChild(m);
  };
  add('a', ourPath, 'OURS');
  add('b', barPath, 'BAR');
  if (!ourPath && !barPath) {
    box.appendChild(node('div', 'miss', 'NO SHOTS YET'));
    return box;
  }
  const tag = node('div', 'tag', swapped.has(key) ? 'BAR' : 'OURS');
  box.appendChild(tag);
  box.appendChild(node('div', 'hint', have.length > 1 ? 'click to swap' : 'only ' + have[0] + ' available'));
  box.addEventListener('click', () => {
    if (swapped.has(key)) swapped.delete(key); else swapped.add(key);
    box.classList.toggle('swapped');
    tag.textContent = swapped.has(key) ? 'BAR' : 'OURS';
  });
  return box;
}

function renderHero(st, pieces, rounds) {
  const hero = el('hero');
  hero.textContent = '';
  // the most recent round that actually carries a shot, else the most recent round
  const r = rounds.find((x) => x.our_shot || x.bar_shot) || rounds[0];
  if (!r) {
    hero.appendChild(node('div', 'ab', ''));
    hero.firstChild.appendChild(node('div', 'miss', 'NO ROUNDS LOGGED YET'));
    el('hero-note').textContent = '';
    return;
  }
  const p = pieces.find((x) => x.id === r.piece) || {};
  hero.appendChild(abBlock('hero:' + r.piece, r.our_shot || p.our_shot, r.bar_shot || p.bar_shot, r.ts, false));
  const side = node('div', 'side');
  const who = node('div', 'who', r.piece);
  side.appendChild(who);
  const dl = node('dl');
  const row = (k, v, cls) => { dl.appendChild(node('dt', null, k)); dl.appendChild(node('dd', cls, v || '—')); };
  row('round', String(r.round ?? '—') + '  ·  ' + (r.agent || '?'));
  row('when', ago(r.ts));
  row('verdict', r.winner ? r.winner.toUpperCase() : 'not judged');
  row('summary', r.summary);
  row('gap', r.gap || p.gap);
  row('ours', r.our_shot || p.our_shot, 'path');
  row('bar', r.bar_shot || p.bar_shot, 'path');
  side.appendChild(dl);
  hero.appendChild(side);
  el('hero-note').textContent = r.piece + ' · round ' + (r.round ?? '?') + ' · ' + ago(r.ts);
}

function renderCards(pieces) {
  const wrap = el('cards');
  wrap.textContent = '';
  for (const p of pieces) {
    const s = statusOf(p);
    const card = node('div', 'card ' + s);
    const head = node('div', 'chead');
    head.appendChild(node('span', 'id', p.id));
    head.appendChild(pill(p));
    head.appendChild(node('span', 'rd', 'RD ' + (p.round || 0)));
    card.appendChild(head);
    card.appendChild(node('div', 'ctitle', p.title || ''));
    card.appendChild(abBlock(p.id, p.our_shot, p.bar_shot, p.updated, true));
    const gap = node('div', 'gap');
    gap.appendChild(node('b', null, 'biggest remaining gap'));
    if (p.gap) gap.appendChild(node('span', null, p.gap));
    else gap.appendChild(node('span', 'none', '—'));
    card.appendChild(gap);
    wrap.appendChild(card);
  }
}

function renderFeed(rounds) {
  const body = el('feed');
  body.textContent = '';
  for (const r of rounds.slice(0, 120)) {
    const tr = node('tr');
    tr.appendChild(node('td', 't', ago(r.ts)));
    tr.appendChild(node('td', 'p', r.piece));
    tr.appendChild(node('td', 't', r.round ?? ''));
    tr.appendChild(node('td', 't', r.agent || ''));
    const w = node('td');
    if (r.winner === 'ours') w.appendChild(node('span', 'pill ours', 'ours'));
    else if (r.winner === 'bar') w.appendChild(node('span', 'pill bar', 'bar'));
    else if (r.winner === 'tie') w.appendChild(node('span', 'pill tie', 'tie'));
    tr.appendChild(w);
    const s = node('td', 's');
    s.appendChild(node('div', null, r.summary || ''));
    if (r.gap) s.appendChild(node('div', 'g', 'gap: ' + r.gap));
    tr.appendChild(s);
    const th = node('td');
    for (const p of [r.our_shot, r.bar_shot]) {
      if (!p) continue;
      const a = node('a'); a.href = url(p); a.target = '_blank';
      const img = node('img', 'thumb'); img.src = url(p, r.ts); img.alt = p;
      img.addEventListener('error', () => { a.remove(); });
      a.appendChild(img); th.appendChild(a); th.appendChild(document.createTextNode(' '));
    }
    tr.appendChild(th);
    body.appendChild(tr);
  }
}

function render(st) {
  const pieces = st.pieces || [];
  const rounds = st.rounds || [];
  const won = pieces.filter((p) => statusOf(p) === 'won').length;
  const judging = pieces.filter((p) => statusOf(p) === 'judging').length;
  const building = pieces.filter((p) => statusOf(p) === 'building').length;
  el('k-won').textContent = won + '/' + (pieces.length || 10);
  el('k-rounds').textContent = rounds.length;
  el('k-active').textContent = judging + building;
  el('k-elapsed').textContent = dur(Date.now() - new Date(st.started).getTime());
  el('k-last').textContent = rounds.length ? ago(rounds[0].ts) : '–';
  const n = pieces.length || 10;
  el('t-won').style.width = (100 * won / n) + '%';
  el('t-judge').style.width = (100 * judging / n) + '%';
  el('t-build').style.width = (100 * building / n) + '%';

  // only rebuild the DOM when state.json actually changed, so clicking A/B is not
  // undone by the 3 s poll
  const stamp = JSON.stringify([st.updated, rounds.length, pieces.map((p) => [p.round, p.status, p.verdict, p.our_shot, p.bar_shot, p.gap, p.updated])]);
  if (stamp !== lastStamp) {
    lastStamp = stamp;
    renderHero(st, pieces, rounds);
    renderCards(pieces);
    renderFeed(rounds);
  }
}

let failures = 0;
async function poll() {
  try {
    const r = await fetch('/gauntlet/state.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const st = await r.json();
    render(st);
    failures = 0;
    el('foot').className = '';
    el('foot').textContent = 'state.json ok · written ' + ago(st.updated) + ' · polling every 3 s · ' +
      'log a round with:  node gauntlet/log.mjs --piece <id> --round <n> --agent critic --winner ours|bar|tie --gap "..." --our shots/... --bar refs/...';
  } catch (e) {
    failures++;
    el('foot').className = 'stale';
    el('foot').textContent = 'CANNOT READ gauntlet/state.json (' + failures + ' attempts): ' + e.message;
  }
}
poll();
setInterval(poll, 3000);
setInterval(() => { lastStamp = ''; }, 30000);   // refresh the relative "Ns ago" labels
</script>
</body>
</html>
